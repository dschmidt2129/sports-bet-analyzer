[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-bet-analyzer"
version = "1.0.0"
description = "Football betting recommendations API and mobile app backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "requests",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "numpy",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sports_bet_analyzer = ["model_weights/*.json"]
